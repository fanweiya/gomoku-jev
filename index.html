<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111312" />
    <link rel="icon" href="data:," />
    <title>五子棋 AI 对战 - Gomoku Three.js</title>
  </head>
  <body>
    <main id="app">
      <canvas id="game-canvas" aria-label="五子棋 3D 棋盘画布" tabindex="0"></canvas>

      <header id="game-header" class="game-header">
        <div class="player-card human" id="player-human">
          <span class="piece-indicator piece-black"></span>
          <span class="player-label">你 · 黑</span>
        </div>

        <div class="status-panel" aria-live="polite" aria-atomic="true">
          <div id="status-text" class="status-primary">你的回合</div>
          <div id="sub-status" class="status-secondary">点击交叉点放置棋子</div>
        </div>

        <div class="player-card ai" id="player-ai">
          <span class="piece-indicator piece-white"></span>
          <span class="player-label" id="ai-player-label">Jev AI · 白</span>
        </div>

        <button id="settings-btn" type="button" class="btn-restart btn-settings" aria-label="AI 服务与密钥配置">
          ⚙ 设置
        </button>

        <button id="restart-btn" type="button" class="btn-restart" aria-label="重新开始对局">
          重新开始
        </button>

        <button id="undo-btn" type="button" class="btn-restart" aria-label="悔棋，撤销最近一轮" title="撤销最近一轮（你和 Jev 各一手）" disabled>
          悔棋
        </button>
      </header>

      <div id="game-overlay" class="game-overlay hidden" aria-modal="true" role="dialog">
        <div class="overlay-dialog">
          <div id="overlay-badge" class="overlay-badge">对局结束</div>
          <h2 id="overlay-title" class="overlay-title">你赢了</h2>
          <p id="overlay-desc" class="overlay-desc">共 25 手 · 执黑获胜</p>
          <p id="overlay-record" class="overlay-record" hidden></p>
          <details id="overlay-moves" class="overlay-moves" hidden>
            <summary>本局棋谱</summary>
            <p id="overlay-moves-text"></p>
          </details>
          <div class="overlay-actions">
            <button id="overlay-restart-btn" type="button" class="btn-primary">再来一局</button>
          </div>
        </div>
      </div>

      <div id="confirm-overlay" class="game-overlay confirm-overlay hidden" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-desc">
        <div class="overlay-dialog confirm-dialog">
          <h2 id="confirm-title" class="overlay-title confirm-title">重新开始对局？</h2>
          <p id="confirm-desc" class="overlay-desc">当前对局将作废。</p>
          <div class="overlay-actions confirm-actions">
            <button id="confirm-cancel-btn" type="button" class="btn-primary btn-secondary">继续对局</button>
            <button id="confirm-restart-btn" type="button" class="btn-primary btn-danger">确认重开</button>
          </div>
        </div>
      </div>

      <div id="settings-overlay" class="game-overlay settings-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <div class="overlay-dialog settings-dialog">
          <div class="settings-header">
            <h2 id="settings-title" class="overlay-title settings-title">AI 服务配置</h2>
            <button id="settings-close-btn" type="button" class="btn-close-x" aria-label="关闭设置">✕</button>
          </div>
          <p class="settings-intro">支持切换多个服务通道、自定义模型与访问密钥。配置仅保存在本地浏览器中。</p>

          <form id="settings-form" class="settings-form">
            <div class="form-group">
              <label for="cfg-provider" class="form-label">服务通道</label>
              <select id="cfg-provider" class="form-select"></select>
            </div>

            <div class="form-group">
              <label for="cfg-endpoint" class="form-label">接口地址 (Endpoint)</label>
              <input type="url" id="cfg-endpoint" class="form-input" placeholder="https://..." spellcheck="false" autocomplete="off" required />
            </div>

            <div class="form-group">
              <label for="cfg-model" class="form-label">模型名称 (Model)</label>
              <input type="text" id="cfg-model" class="form-input" list="cfg-model-list" placeholder="例如 jev-latest" spellcheck="false" autocomplete="off" required />
              <datalist id="cfg-model-list"></datalist>
            </div>

            <div class="form-group">
              <div class="form-label-row">
                <label for="cfg-key" class="form-label">API 密钥 (API Key)</label>
                <button type="button" id="cfg-fill-preset-key-btn" class="btn-link" title="填入当前通道提供的预设 Key">填入预设 Key</button>
              </div>
              <div class="input-with-button">
                <input type="password" id="cfg-key" class="form-input" placeholder="密钥（可选，未设置时走本地启发式算法）" spellcheck="false" autocomplete="off" />
                <button type="button" id="cfg-toggle-key-btn" class="btn-icon-inside" aria-label="显示或隐藏密钥">显示</button>
              </div>
            </div>

            <div class="form-group">
              <label for="cfg-headers" class="form-label">自定义请求头 (JSON 格式，可选)</label>
              <input type="text" id="cfg-headers" class="form-input font-mono" placeholder='{"TypeSafe-Danger-Zone-Images": "true"}' spellcheck="false" autocomplete="off" />
            </div>

            <div id="settings-status" class="settings-status" role="status" aria-live="polite"></div>

            <div class="overlay-actions settings-actions">
              <button type="button" id="cfg-test-btn" class="btn-primary btn-secondary">测试连接</button>
              <button type="button" id="cfg-cancel-btn" class="btn-primary btn-secondary">取消</button>
              <button type="submit" id="cfg-save-btn" class="btn-primary">保存配置</button>
            </div>
          </form>
        </div>
      </div>

      <div id="camera-hint" class="camera-hint">拖动旋转 360° · 滚轮/双指缩放 · 点击交叉点下子</div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
